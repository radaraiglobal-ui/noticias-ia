<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Radar de Noticias IA</title>
</head>
<body>

<h1>Noticias IA</h1>
<div id="posts"></div>

<script>
fetch('https://amzn-s3-radar.s3.us-east-2.amazonaws.com/posts.json')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('posts');

    data.items.forEach(post => {
      const div = document.createElement('div');
      div.style.marginBottom = "30px";

      div.innerHTML = `
        <h2>${post.title_es}</h2>
        <p>${post.summary_es}</p>
        <a href="${post.source_url}" target="_blank">Leer fuente</a><br><br>
        <a href="${post.image_url}" target="_blank">Ver imagen</a>
      `;

      container.appendChild(div);
    });
  });
</script>

</body>
</html>
